pull_request_rules: []
commands_restrictions:
  queue:
    conditions:
      - sender-permission >= write
merge_queue:
  mode: serial
  max_parallel_checks: 1
scopes:
  source:
    files:
      critical:
        include:
          - '**/*'
        exclude:
          - 'critical/*.md'
queue_rules:
  - name: default
    batch_size: 1
    queue_conditions: []
    merge_conditions:
      - check-success = ci-gate
    max_checks_retries: 0
    merge_method: merge
    checks_timeout: null
