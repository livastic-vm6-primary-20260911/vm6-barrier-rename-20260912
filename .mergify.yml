pull_request_rules:
  - name: VM6 shared-head auto-merge trigger 261001
    conditions:
      - base = vm6-shared-head-base1-261001
      - title = VM6_SHARED_HEAD_DELETE_TRIGGER_261001
    actions:
      merge: {}
  - name: VM6 shared-head delete after merge 261001
    conditions:
      - merged
      - title = VM6_SHARED_HEAD_DELETE_TRIGGER_261001
    actions:
      delete_head_branch:
        force: false
commands_restrictions:
  queue:
    conditions:
      - sender-permission >= write

merge_queue:
  mode: serial
  max_parallel_checks: 1

queue_rules:
  - name: vm6-pending-revocation-20260927
    batch_size: 1
    queue_conditions:
      - title = VM6_PENDING_TRIGGER_20260927
    merge_conditions:
      - title = VM6_PENDING_TRIGGER_20260927
    max_checks_retries: 0
    merge_method: merge
    checks_timeout: null
