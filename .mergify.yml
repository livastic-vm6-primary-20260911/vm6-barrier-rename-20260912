pull_request_rules:
  - name: VM6 dismiss old approvals D17R1
    conditions:
      - base = vm6-dismiss-base-d17r1
      - title = VM6 dismiss post-push review D17R1
    actions:
      dismiss_reviews:
        approved: true
        changes_requested: false
        when: synchronize
        message: VM6 D17R1 dismiss only pre-push approvals
commands_restrictions:
  queue:
    conditions:
      - sender-permission >= write
merge_queue:
  mode: serial
  max_parallel_checks: 1
queue_rules:
  - name: default
    batch_size: 1
    queue_conditions: []
    merge_conditions:
      - check-success = @github-actions/vm6-synthetic-head-delay
    max_checks_retries: 0
    merge_method: merge
    checks_timeout: null
