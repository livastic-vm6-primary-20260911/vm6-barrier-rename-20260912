pull_request_rules:
  - name: VM6 autosquash deprecated positive control
    conditions:
      - "#commits-behind>0"
    actions:
      rebase:
        bot_account: livastic-vm6-primary-rn260917
        autosquash: true
commands_restrictions:
  queue:
    conditions:
      - sender-permission >= write
merge_queue:
  mode: serial
  max_parallel_checks: 1
queue_rules:
  - name: default
    batch_size: 1
    queue_conditions: []
    merge_conditions:
      - check-success = @github-actions/vm6-synthetic-head-delay
    max_checks_retries: 0
    merge_method: merge
    checks_timeout: null
