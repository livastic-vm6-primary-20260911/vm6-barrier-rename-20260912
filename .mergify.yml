pull_request_rules:
  - name: VM6 stale reviewer lowpriv fork chain T7P9
    conditions:
      - base = vm6-review-chain-base-t7p9
      - title = VM6 stale reviewer lowpriv fork chain T7P9
      - label = vm6-review-chain-trusted-gate-t7p9
      - -changes-requested-reviews-by = @m6d911z2/vm6-team-revocation-control
    actions:
      merge:
        method: merge
commands_restrictions:
  queue:
    conditions:
      - sender-permission >= write
merge_queue:
  mode: serial
  max_parallel_checks: 1
queue_rules:
  - name: default
    batch_size: 1
    queue_conditions: []
    merge_conditions:
      - check-success = @github-actions/vm6-synthetic-head-delay
    max_checks_retries: 0
    merge_method: merge
    checks_timeout: null
