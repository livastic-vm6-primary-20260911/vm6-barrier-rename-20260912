pull_request_rules: []
commands_restrictions:
  queue:
    conditions:
      - sender-permission >= write
merge_queue:
  mode: serial
  max_parallel_checks: 1
queue_rules:
  - name: default
    batch_size: 1
    queue_conditions: []
    merge_conditions:
      - check-success = @github-actions/vm6-synthetic-head-delay
    max_checks_retries: 0
    merge_method: merge
    checks_timeout: null
priority_rules:
  - name: urgent-interrupter
    conditions:
      - title = VM6_INTERRUPT_HIGH
    priority: high
    allow_checks_interruption: true
  - name: normal-victim
    conditions:
      - title = VM6_INTERRUPT_LOW
    priority: low
    allow_checks_interruption: false
