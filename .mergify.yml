pull_request_rules: []
commands_restrictions:
  queue:
    conditions:
      - sender-permission >= write
merge_queue:
  max_parallel_checks: 1
queue_rules:
  - name: default
    queue_conditions: []
    merge_conditions:
      - check-success = @github-actions/vm6-direct-close-check
      - label = vm6-direct-release
    merge_method: merge
    checks_timeout: null
