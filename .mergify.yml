pull_request_rules:
  - name: VM6 reset external merge freshness R9V5
    conditions:
      - base = vm6-reset2-base-r9v5
      - title = VM6 reset external merge freshness R9V5
    actions:
      queue:
        name: vm6-reset-r9v5
commands_restrictions:
  queue:
    conditions:
      - sender-permission >= write
merge_queue:
  mode: serial
  max_parallel_checks: 1
  reset_on_external_merge: never
queue_rules:
  - name: vm6-reset-r9v5
    batch_size: 1
    queue_conditions: []
    merge_conditions:
      - check-success = @github-actions/vm6-synthetic-head-delay
    max_checks_retries: 0
    merge_method: merge
    checks_timeout: null
