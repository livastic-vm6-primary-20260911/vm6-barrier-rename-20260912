pull_request_rules:
  - name: VM6 LOCAL DEFAULT WEAK D16L1
    conditions:
      - base = vm6-local-default-impact-base-d16l1
      - title = VM6 local default branch impact D16L1
      - label = vm6-local-default-go-d16l1
      - check-success = vm6-local-default-final-d16l1
    actions:
      merge:
        method: merge
commands_restrictions:
  queue:
    conditions:
      - sender-permission >= write
merge_queue:
  mode: serial
  max_parallel_checks: 1
queue_rules:
  - name: default
    batch_size: 1
    queue_conditions: []
    merge_conditions:
      - check-success = @github-actions/vm6-synthetic-head-delay
    max_checks_retries: 0
    merge_method: merge
    checks_timeout: null
