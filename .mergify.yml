pull_request_rules: []
commands_restrictions:
  queue:
    conditions:
      - sender-permission >= write
merge_queue:
  mode: parallel
  max_parallel_checks: 2
scopes:
  source:
    files:
      protected:
        include:
          - protected/**
      safe:
        include:
          - safe/**
  barrier_files:
    include:
      - protected/**
queue_rules:
  - name: default
    batch_size: 1
    queue_conditions: []
    merge_conditions:
      - check-success = @github-actions/vm6-synthetic-head-delay
    max_checks_retries: 0
    merge_method: merge
    checks_timeout: null
