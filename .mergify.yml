pull_request_rules: []
commands_restrictions:
  queue:
    conditions:
      - sender-permission >= write
merge_queue:
  mode: serial
  max_parallel_checks: 1
queue_rules:
  - name: default
    batch_size: 1
    branch_protection_injection_mode: merge
    queue_conditions:
      - check-success = @github-actions/vm6-bp-merge-mode-delay
    merge_conditions:
      - check-success = @github-actions/vm6-bp-merge-mode-delay
    max_checks_retries: 0
    merge_method: merge
    merge_bot_account: livastic-vm6-primary-20260911
    checks_timeout: null
