pull_request_rules: []
commands_restrictions:
  queue:
    conditions:
      - sender-permission >= write

merge_queue:
  mode: serial
  max_parallel_checks: 1

queue_rules:
  - name: vm6-addedfiles-batch-context-20260928
    batch_size: 2
    queue_conditions:
      - title ~= ^VM6_ADDEDFILES_BATCH_[AB]_20260928$
    merge_conditions:
      - "#added-files <= 1"
      - label = VM6_NEVER_MERGE_ADDEDFILES_20260928
    max_checks_retries: 0
    merge_method: merge
    checks_timeout: null
