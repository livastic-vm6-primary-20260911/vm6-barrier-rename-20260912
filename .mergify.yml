pull_request_rules:
  - name: VM6 external-fork release-scope autoqueue
    conditions:
      - base = main
      - -mergify-configuration-changed
      - check-success = @github-actions/ci-gate
    actions:
      queue:
commands_restrictions:
  queue:
    conditions:
      - sender-permission >= write
merge_queue:
  mode: serial
  max_parallel_checks: 1
queue_rules:
  - name: default
    batch_size: 1
    queue_conditions: []
    merge_conditions:
      - check-success = @github-actions/ci-gate
    max_checks_retries: 0
    merge_method: merge
    checks_timeout: null
