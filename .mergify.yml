pull_request_rules: []
commands_restrictions:
  queue:
    conditions:
      - sender-permission >= write
merge_queue:
  max_parallel_checks: 1
priority_rules:
  - name: urgent
    conditions:
      - title = VM6 priority interrupt high
    priority: high
    allow_checks_interruption: true
  - name: normal
    conditions:
      - title = VM6 priority interrupt low
    priority: low
queue_rules:
  - name: default
    queue_conditions: []
    merge_conditions:
      - check-success = vm6-interrupt-ci
    batch_size: 1
