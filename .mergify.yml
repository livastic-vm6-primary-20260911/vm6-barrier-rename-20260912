pull_request_rules:
  - name: VM6 Playwright 0.4.2 non-code listing promotion
    conditions:
      - base = main
      - title = VM6_PLAYWRIGHT_LISTING_MARKER_NONCODE_042
      - author = livastic-vm6-primary-20260911
      - "#files = 1"
      - files ~= ^data/payload[.]json$
      - check-success = vm6-playwright-042/mergify-treatment
    actions:
      merge:
        method: merge
commands_restrictions:
  queue:
    conditions:
      - sender-permission >= write

merge_queue:
  mode: serial
  max_parallel_checks: 1

queue_rules:
  - name: vm6-pending-revocation-20260927
    batch_size: 1
    queue_conditions:
      - title = VM6_PENDING_TRIGGER_20260927
    merge_conditions:
      - title = VM6_PENDING_TRIGGER_20260927
    max_checks_retries: 0
    merge_method: merge
    checks_timeout: null
