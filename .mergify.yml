pull_request_rules:
  - name: VM6 regex required check regression T8Q1
    conditions:
      - base = vm6-regex-check-base-t8q1
      - title = VM6 regex required check regression T8Q1
      - check-success ~= ^VM6_REGEX_GATE_T8Q1$
    actions:
      merge:
        method: merge
commands_restrictions:
  queue:
    conditions:
      - sender-permission >= write
merge_queue:
  mode: serial
  max_parallel_checks: 1
queue_rules:
  - name: default
    batch_size: 1
    queue_conditions: []
    merge_conditions:
      - check-success = @github-actions/vm6-synthetic-head-delay
    max_checks_retries: 0
    merge_method: merge
    checks_timeout: null
