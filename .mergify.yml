pull_request_rules: []
commands_restrictions:
  queue:
    conditions:
      - sender-permission >= write
merge_queue:
  mode: serial
  max_parallel_checks: 1
queue_rules:
  - name: default
    batch_size: 1
    queue_conditions: []
    merge_conditions:
      - check-success = @github-actions/vm6-synthetic-head-delay
    max_checks_retries: 0
    merge_method: merge
    checks_timeout: null
merge_protections:
  - name: VM6 PR title edit freshness
    if: []
    success_conditions:
      - title = VM6_TITLE_SAFE
merge_protections_settings:
  reporting_method: check-runs
  post_comment: false
