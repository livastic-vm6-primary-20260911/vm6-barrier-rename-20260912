pull_request_rules: []
commands_restrictions:
  queue:
    conditions:
      - sender-permission >= write
merge_queue:
  mode: serial
  max_parallel_checks: 1
queue_rules:
  - name: default
    batch_size: 1
    queue_conditions:
      - check-success = @github-actions/vm6-direct-final-check
    merge_conditions:
      - check-success = @github-actions/vm6-direct-final-check
    max_checks_retries: 0
    merge_method: merge
    checks_timeout: null
