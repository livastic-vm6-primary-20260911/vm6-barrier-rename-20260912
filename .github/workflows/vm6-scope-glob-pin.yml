name: VM6 Scope Glob Pin CI
on:
  pull_request:
permissions:
  contents: read
jobs:
  detect-default:
    runs-on: ubuntu-24.04
    outputs:
      critical: ${{ fromJSON(steps.scopes.outputs.scopes).critical }}
      scopes: ${{ steps.scopes.outputs.scopes }}
    steps:
      - uses: actions/checkout@v5
      - name: Detect scopes with official default pin
        id: scopes
        uses: Mergifyio/gha-mergify-ci@v25
        with:
          action: scopes
      - name: Record default result
        run: |
          echo "default_scopes=${{ steps.scopes.outputs.scopes }}"

  detect-latest:
    runs-on: ubuntu-24.04
    outputs:
      critical: ${{ fromJSON(steps.scopes.outputs.scopes).critical }}
      scopes: ${{ steps.scopes.outputs.scopes }}
    steps:
      - uses: actions/checkout@v5
      - name: Detect scopes with latest CLI
        id: scopes
        uses: Mergifyio/gha-mergify-ci@v25
        with:
          action: scopes
          mergify_cli_version: latest
      - name: Record latest result
        run: |
          echo "latest_scopes=${{ steps.scopes.outputs.scopes }}"

  critical-tests:
    needs: detect-default
    if: ${{ needs.detect-default.outputs.critical == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Critical security test must run for the critical scope
        run: |
          echo 'VM6 critical test executed: nested markdown is engine-critical'
          exit 1

  ci-gate:
    if: ${{ !cancelled() }}
    needs:
      - detect-default
      - critical-tests
    runs-on: ubuntu-24.04
    steps:
      - name: Official aggregate gate
        uses: Mergifyio/gha-mergify-ci@v25
        with:
          action: wait-jobs
          jobs: ${{ toJSON(needs) }}
