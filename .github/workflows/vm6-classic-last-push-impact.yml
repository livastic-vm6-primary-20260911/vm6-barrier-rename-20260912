name: VM6 Classic Last-Push Trusted-Main Impact
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  prove-upstream-write:
    runs-on: ubuntu-latest
    steps:
      - name: Create controlled branch with upstream GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          repo=os.environ['REPO']; sha=os.environ['SHA']; token=os.environ['GH_TOKEN']
          ref='refs/heads/vm6-classic-last-push-token-write-20260913'
          req=urllib.request.Request(
              f'https://api.github.com/repos/{repo}/git/refs',
              data=json.dumps({'ref':ref,'sha':sha}).encode(),
              headers={
                  'Authorization':f'Bearer {token}',
                  'Accept':'application/vnd.github+json',
                  'X-GitHub-Api-Version':'2022-11-28',
                  'User-Agent':'vm6-classic-last-push-impact',
                  'Content-Type':'application/json',
              },
              method='POST',
          )
          with urllib.request.urlopen(req, timeout=15) as r:
              print('VM6_BRANCH_CREATE_HTTP', r.status)
          PY
