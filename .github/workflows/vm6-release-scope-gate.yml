name: VM6 Release Scope Gate
on:
  pull_request:

permissions:
  contents: read

jobs:
  detect-scopes:
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ fromJSON(steps.scopes.outputs.scopes).release }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Detect release-sensitive scope using owner custom path
        id: scopes
        uses: Mergifyio/gha-mergify-ci@v25
        with:
          action: scopes
          mergify_config_path: .ci/mergify-scopes.yml

  release-required:
    needs: detect-scopes
    if: ${{ needs.detect-scopes.outputs.release == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Controlled release-workflow protection gate
        run: |
          echo 'VM6 controlled release workflow protection gate: expected failure for release workflow changes'
          exit 1

  ci-gate:
    if: ${{ !cancelled() }}
    needs:
      - detect-scopes
      - release-required
    runs-on: ubuntu-24.04
    steps:
      - name: Aggregate required jobs
        uses: Mergifyio/gha-mergify-ci@v25
        with:
          action: wait-jobs
          jobs: ${{ toJSON(needs) }}
