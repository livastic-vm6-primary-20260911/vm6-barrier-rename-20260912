name: VM6 Release Provenance Proof
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write
jobs:
  provenance:
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - name: Record trusted workflow context before checkout
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          EVENT_TARGET: ${{ github.event.release.target_commitish }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_REF: ${{ github.ref }}
        run: |
          echo "VM6_RELEASE_TAG=$EVENT_TAG"
          echo "VM6_RELEASE_TARGET=$EVENT_TARGET"
          echo "VM6_WORKFLOW_SHA=$WORKFLOW_SHA"
          echo "VM6_EVENT_SHA=$EVENT_SHA"
          echo "VM6_EVENT_REF=$EVENT_REF"
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - name: Prove release tag content, without publishing anything
        shell: bash
        run: |
          set -euo pipefail
          echo "VM6_CHECKED_OUT_SHA=$(git rev-parse HEAD)"
          printf 'VM6_TAG_PAYLOAD='; cat vm6-release-payload.txt
      - name: Mint and decode the same GitHub OIDC class used by Trusted Publishing
        shell: bash
        env:
          REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
          REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
        run: |
          set -euo pipefail
          RESP=$(curl -fsSL -H "Authorization: bearer $REQUEST_TOKEN" "${REQUEST_URL}&audience=npm:registry.npmjs.org")
          JWT=$(jq -r .value <<<"$RESP")
          PAYLOAD=$(cut -d. -f2 <<<"$JWT" | tr '_-' '/+')
          PAD=$(( (4 - ${#PAYLOAD} % 4) % 4 ))
          PAYLOAD="$PAYLOAD$(printf '=%.0s' $(seq 1 $PAD))"
          printf '%s' "$PAYLOAD" | base64 -d > "$RUNNER_TEMP/oidc.json"
          jq '{sub,aud,repository,repository_owner,ref,sha,workflow,workflow_ref,workflow_sha,environment,actor,event_name}' "$RUNNER_TEMP/oidc.json"
