name: VM6 Release Provenance Proof
on:
  release:
    types: [published]
  push:
    tags:
      - 'vm6-trusted-tag-*'
permissions:
  contents: read
  id-token: write
jobs:
  provenance:
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - name: VM6 attacker-controlled trusted release marker
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          EVENT_TARGET: ${{ github.event.release.target_commitish }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_REF: ${{ github.ref }}
        run: |
          echo 'VM6_ATTACKER_RELEASE_WORKFLOW_EXECUTED=1'
          echo "VM6_RELEASE_TAG=$EVENT_TAG"
          echo "VM6_RELEASE_TARGET=$EVENT_TARGET"
          echo "VM6_WORKFLOW_SHA=$WORKFLOW_SHA"
          echo "VM6_EVENT_SHA=$EVENT_SHA"
          echo "VM6_EVENT_REF=$EVENT_REF"
      - name: Mint and decode controlled GitHub OIDC claims
        shell: bash
        run: |
          set -euo pipefail
          RESP=$(curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=vm6:controlled-release-proof")
          JWT=$(jq -r .value <<<"$RESP")
          PAYLOAD=$(cut -d. -f2 <<<"$JWT" | tr '_-' '/+')
          PAD=$(( (4 - ${#PAYLOAD} % 4) % 4 ))
          PAYLOAD="$PAYLOAD$(printf '=%.0s' $(seq 1 $PAD))"
          printf '%s' "$PAYLOAD" | base64 -d > "$RUNNER_TEMP/oidc.json"
          jq '{sub,aud,repository,repository_owner,ref,sha,workflow,workflow_ref,workflow_sha,environment,actor,event_name}' "$RUNNER_TEMP/oidc.json"
