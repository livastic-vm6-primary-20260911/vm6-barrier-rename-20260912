name: VM6 Freeze Gate
on:
  pull_request:
    branches: [main]
jobs:
  vm6-freeze-ext-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Controlled gate
        shell: bash
        run: |
          set -euo pipefail
          test -f lane/canary.txt
          if grep -qx 'TRUSTED_A_FREEZE_261003' lane/canary.txt; then
            sleep 90
          fi
