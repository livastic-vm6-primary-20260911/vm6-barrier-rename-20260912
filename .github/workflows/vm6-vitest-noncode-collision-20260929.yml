name: VM6 Vitest Noncode Collision 20260929

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  vm6-vitest-collision-control:
    name: vm6-vitest-collision-control
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Overlay only the PR JSON data file
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" --paginate --jq '.[].filename')
          printf 'PR_FILES=%s\n' "${files[*]}"
          test "${#files[@]}" -eq 1
          test "${files[0]}" = "data/security_state.json"
          gh api "repos/${HEAD_REPO}/contents/data/security_state.json?ref=${HEAD_SHA}" --jq '.content' | base64 -d > data/security_state.json
          python3 - <<'PY'
          import json
          with open("data/security_state.json", "r", encoding="utf-8") as f:
              value = json.load(f)
          assert set(value) == {"safe"}
          assert type(value["safe"]) is bool
          print("TRUSTED_JSON_SAFE_VALUE=", value["safe"])
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install trusted pinned test tooling
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Plain Vitest control
        run: npx vitest run -c vitest.control.config.mjs

  vm6-vitest-collision-treatment:
    name: vm6-vitest-collision-treatment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Overlay only the PR JSON data file
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" --paginate --jq '.[].filename')
          printf 'PR_FILES=%s\n' "${files[*]}"
          test "${#files[@]}" -eq 1
          test "${files[0]}" = "data/security_state.json"
          gh api "repos/${HEAD_REPO}/contents/data/security_state.json?ref=${HEAD_SHA}" --jq '.content' | base64 -d > data/security_state.json
          python3 - <<'PY'
          import json
          with open("data/security_state.json", "r", encoding="utf-8") as f:
              value = json.load(f)
          assert set(value) == {"safe"}
          assert type(value["safe"]) is bool
          print("TRUSTED_JSON_SAFE_VALUE=", value["safe"])
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install trusted pinned test tooling
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Released Mergify Vitest treatment
        env:
          MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN }}
        run: npx vitest run -c vitest.mergify.config.mjs
