name: VM6 Backport Trusted CI
on:
  pull_request:
permissions:
  contents: read
jobs:
  vm6-backport-trusted-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Record exact tested head
        run: |
          echo "VM6_BACKPORT_TRUSTED_CI_SHA=${{ github.event.pull_request.head.sha }}"
          echo "VM6_BACKPORT_TRUSTED_CI_OK"
