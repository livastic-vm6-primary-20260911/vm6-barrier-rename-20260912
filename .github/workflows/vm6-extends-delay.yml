name: VM6 Extends Delay
on:
  pull_request:

jobs:
  vm6-extends-delay:
    runs-on: ubuntu-latest
    steps:
      - name: Hold running batch while remote config changes
        shell: bash
        run: |
          set -euo pipefail
          echo 'holding target batch while extends source policy changes'
          sleep 120
          echo 'delayed CI success'
