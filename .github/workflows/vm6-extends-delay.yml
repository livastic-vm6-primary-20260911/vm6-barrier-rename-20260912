name: VM6 Extends Delay
on:
  pull_request:

jobs:
  vm6-extends-delay:
    runs-on: ubuntu-latest
    steps:
      - name: Hold active batch while remote extends policy changes
        shell: bash
        run: |
          set -euo pipefail
          echo 'holding batch while extends source policy changes'
          sleep 120
          echo 'delayed CI success'
