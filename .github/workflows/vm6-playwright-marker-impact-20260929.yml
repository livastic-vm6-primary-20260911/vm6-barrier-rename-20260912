name: VM6 Playwright Marker Impact 20260929

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  vm6-playwright-marker-control:
    name: vm6-playwright-marker-control
    if: github.event.pull_request.title == 'VM6_PLAYWRIGHT_MARKER_PROTECTED_20260929'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Build trusted control fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/vm6-playwright-marker/tests
          cd /tmp/vm6-playwright-marker
          cat > package.json <<'JSON'
          {
            "private": true,
            "type": "module",
            "devDependencies": {
              "@mergifyio/playwright": "0.4.1",
              "@playwright/test": "1.62.1"
            }
          }
          JSON
          npm install --no-audit --no-fund
          cat > playwright.control.config.mjs <<'JS'
          import { defineConfig } from '@playwright/test';
          export default defineConfig({
            testDir: './tests',
            workers: 1,
            reporter: [['line']],
          });
          JS
          cat > tests/victim.spec.mjs <<'JS'
          import { readFileSync } from 'node:fs';
          import { test, expect } from '@playwright/test';

          test('victim security invariant', async () => {
            const source = readFileSync(new URL('./attacker.spec.mjs', import.meta.url), 'utf8');
            expect(source).not.toContain('VM6_UNSAFE_PAYLOAD');
          });
          JS
      - name: Fetch only attacker-controlled test file
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/vm6-playwright-marker
          gh api "repos/$HEAD_REPO/contents/tests/attacker.spec.mjs?ref=$HEAD_SHA" --jq '.content' | base64 -d > tests/attacker.spec.mjs
      - name: Plain Playwright control
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/vm6-playwright-marker
          npx playwright test -c playwright.control.config.mjs --shard=1/1

  vm6-playwright-marker-treatment:
    name: vm6-playwright-marker-treatment
    if: github.event.pull_request.title == 'VM6_PLAYWRIGHT_MARKER_PROTECTED_20260929'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Build trusted Mergify fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/vm6-playwright-marker/tests
          cd /tmp/vm6-playwright-marker
          cat > package.json <<'JSON'
          {
            "private": true,
            "type": "module",
            "devDependencies": {
              "@mergifyio/playwright": "0.4.1",
              "@playwright/test": "1.62.1"
            }
          }
          JSON
          npm install --no-audit --no-fund
          cat > vm6-mergify-reporter.mjs <<'JS'
          export { MergifyReporter as default } from '@mergifyio/playwright';
          JS
          cat > playwright.mergify.config.mjs <<'JS'
          import { defineConfig } from '@playwright/test';
          export default defineConfig({
            testDir: './tests',
            workers: 1,
            reporter: [['./vm6-mergify-reporter.mjs'], ['line']],
          });
          JS
          cat > tests/victim.spec.mjs <<'JS'
          import { readFileSync } from 'node:fs';
          import { test, expect } from '@playwright/test';

          test('victim security invariant', async () => {
            const source = readFileSync(new URL('./attacker.spec.mjs', import.meta.url), 'utf8');
            expect(source).not.toContain('VM6_UNSAFE_PAYLOAD');
          });
          JS
      - name: Fetch only attacker-controlled test file
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/vm6-playwright-marker
          gh api "repos/$HEAD_REPO/contents/tests/attacker.spec.mjs?ref=$HEAD_SHA" --jq '.content' | base64 -d > tests/attacker.spec.mjs
      - name: Start exact feature-unavailable HTTP fallback
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/vm6-playwright-marker
          python3 -m http.server 18777 --bind 127.0.0.1 >/tmp/vm6-marker-http.log 2>&1 &
          sleep 1
      - name: Current Mergify Playwright 0.4.1 treatment
        env:
          MERGIFY_TOKEN: vm6-dummy-token
          MERGIFY_API_URL: http://127.0.0.1:18777
          MERGIFY_TEST_SELECTION_ENABLE: 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/vm6-playwright-marker
          npx playwright test -c playwright.mergify.config.mjs --shard=1/1
