name: VM6 Synthetic Head Delay
on:
  pull_request:

jobs:
  vm6-synthetic-head-delay:
    runs-on: ubuntu-latest
    steps:
      - name: Hold synthetic batch
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.head_ref }}" == mergify/merge-queue/* ]]; then
            echo 'holding synthetic batch for product revocation window'
            sleep 300
          else
            echo 'short control path for normal pull requests'
            sleep 5
          fi
          echo 'delay check success'
