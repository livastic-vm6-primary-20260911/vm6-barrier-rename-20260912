name: VM6 App Pinned Required Workflow
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  gate:
    name: vm6-app-pinned-required
    runs-on: ubuntu-latest
    steps:
      - name: context result
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "title=$PR_TITLE"
          if [ "$PR_TITLE" = "VM6 classic app pin bootstrap" ]; then
            echo "bootstrap source success"
            exit 0
          fi
          echo "trusted GitHub Actions source deliberately fails on discriminator PR"
          exit 1
