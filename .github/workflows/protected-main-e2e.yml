name: protected-main-e2e

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions: {}

concurrency:
  group: protected-main-e2e-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  plain-control:
    name: plain-control
    if: >-
      github.event.pull_request.user.login == 'livastic-vm6-primary-20260911' &&
      github.event.pull_request.head.repo.full_name == 'livastic-vm6-primary-20260911/vm6-barrier-rename-20260912'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out trusted base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch only the allowed PR data file
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("node:fs");
            const pr = context.payload.pull_request;
            const expectedRepo = "livastic-vm6-primary-20260911/vm6-barrier-rename-20260912";
            if (!pr || !pr.head.repo || pr.user.login !== "livastic-vm6-primary-20260911" ||
                !pr.head.repo.fork || pr.head.repo.full_name !== expectedRepo ||
                pr.base.ref !== "main" || pr.head.repo.full_name === pr.base.repo.full_name) {
              throw new Error("PR actor/base is outside the non-code test fixture.");
            }
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100
            });
            if (files.length !== 1 || files[0].filename !== "data/payload.json" || files[0].status !== "modified") {
              throw new Error("PR must modify only data/payload.json.");
            }
            const response = await github.rest.repos.getContent({
              owner: pr.head.repo.owner.login,
              repo: pr.head.repo.name,
              path: "data/payload.json",
              ref: pr.head.sha
            });
            const file = response.data;
            if (Array.isArray(file) || file.type !== "file" || file.encoding !== "base64" || file.size > 16384) {
              throw new Error("PR input is not a bounded regular JSON file.");
            }
            const bytes = Buffer.from(file.content.replace(/\n/g, ""), "base64");
            fs.writeFileSync("data/payload.json", bytes);
            fs.writeFileSync("payload.json", bytes);
            core.info("TRUSTED_BASE_SHA=" + pr.base.sha);
            core.info("PR_HEAD_SHA=" + pr.head.sha);

      - name: Validate and install trusted dependencies
        run: |
          npm ci --include=dev --ignore-scripts --no-audit --no-fund
          npm run validate:payload

      - name: Plain Playwright control
        run: npm run test:plain

  mergify-treatment:
    name: mergify-treatment
    if: >-
      github.event.pull_request.user.login == 'livastic-vm6-primary-20260911' &&
      github.event.pull_request.head.repo.full_name == 'livastic-vm6-primary-20260911/vm6-barrier-rename-20260912'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      MERGIFY_TEST_SELECTION_ENABLE: "true"
      MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN }}
    steps:
      - name: Check out trusted base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch only the allowed PR data file
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("node:fs");
            const pr = context.payload.pull_request;
            const expectedRepo = "livastic-vm6-primary-20260911/vm6-barrier-rename-20260912";
            if (!pr || !pr.head.repo || pr.user.login !== "livastic-vm6-primary-20260911" ||
                !pr.head.repo.fork || pr.head.repo.full_name !== expectedRepo ||
                pr.base.ref !== "main" || pr.head.repo.full_name === pr.base.repo.full_name) {
              throw new Error("PR actor/base is outside the non-code test fixture.");
            }
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100
            });
            if (files.length !== 1 || files[0].filename !== "data/payload.json" || files[0].status !== "modified") {
              throw new Error("PR must modify only data/payload.json.");
            }
            const response = await github.rest.repos.getContent({
              owner: pr.head.repo.owner.login,
              repo: pr.head.repo.name,
              path: "data/payload.json",
              ref: pr.head.sha
            });
            const file = response.data;
            if (Array.isArray(file) || file.type !== "file" || file.encoding !== "base64" || file.size > 16384) {
              throw new Error("PR input is not a bounded regular JSON file.");
            }
            const bytes = Buffer.from(file.content.replace(/\n/g, ""), "base64");
            fs.writeFileSync("data/payload.json", bytes);
            fs.writeFileSync("payload.json", bytes);
            core.info("TRUSTED_BASE_SHA=" + pr.base.sha);
            core.info("PR_HEAD_SHA=" + pr.head.sha);

      - name: Validate and install trusted dependencies
        run: |
          npm ci --include=dev --ignore-scripts --no-audit --no-fund
          npm run validate:payload

      - name: Mergify Playwright 0.4.2 treatment
        run: npm run test:mergify

  report-head-statuses:
    name: report-head-statuses
    if: >-
      always() &&
      github.event.pull_request.user.login == 'livastic-vm6-primary-20260911' &&
      github.event.pull_request.head.repo.full_name == 'livastic-vm6-primary-20260911/vm6-barrier-rename-20260912'
    needs:
      - plain-control
      - mergify-treatment
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      statuses: write
    env:
      PLAIN_RESULT: ${{ needs.plain-control.result }}
      TREATMENT_RESULT: ${{ needs.mergify-treatment.result }}
      ACTIONS_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Publish both outcomes on the exact PR head SHA
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const expectedRepo = "livastic-vm6-primary-20260911/vm6-barrier-rename-20260912";
            if (!pr || !pr.head.repo || pr.user.login !== "livastic-vm6-primary-20260911" ||
                pr.head.repo.full_name !== expectedRepo || pr.base.ref !== "main") {
              throw new Error("PR actor/base is outside the non-code test fixture.");
            }
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100
            });
            if (files.length !== 1 || files[0].filename !== "data/payload.json" || files[0].status !== "modified") {
              throw new Error("PR must modify only data/payload.json before a head status is recorded.");
            }
            const runUrl = process.env.ACTIONS_RUN_URL;
            const statuses = [
              { context: "vm6-playwright-042/plain-control", result: process.env.PLAIN_RESULT },
              { context: "vm6-playwright-042/mergify-treatment", result: process.env.TREATMENT_RESULT }
            ];
            for (const item of statuses) {
              const state = item.result === "success" ? "success" : "failure";
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: pr.head.sha,
                state: state,
                context: item.context,
                target_url: runUrl,
                description: "Trusted base Playwright result: " + item.result
              });
              core.info("HEAD_STATUS " + item.context + "=" + state + " sha=" + pr.head.sha);
            }
