name: VM6 github-actions bot command prerequisite
on:
  push:
    branches:
      - main
permissions:
  contents: read
  issues: write
  pull-requests: write
jobs:
  comment:
    if: github.event.head_commit.message == 'vm6-bot-command-prerequisite-rest'
    runs-on: ubuntu-latest
    steps:
      - name: Post one Mergify queue command as github-actions bot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/m6d911z2/vm6-barrier-rename-20260912/issues/33/comments \
            -d '{"body":"@Mergifyio queue"}'
