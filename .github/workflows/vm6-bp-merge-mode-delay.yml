name: VM6 BP Merge Mode Delay
on:
  pull_request:

jobs:
  vm6-bp-merge-mode-delay:
    runs-on: ubuntu-latest
    steps:
      - name: Hold finalizer window
        shell: bash
        run: |
          set -euo pipefail
          echo 'holding while branch protection is added'
          sleep 120
          echo 'trusted delayed success'
