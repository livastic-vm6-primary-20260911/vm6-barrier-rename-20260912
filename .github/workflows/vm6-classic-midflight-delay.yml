name: VM6 Classic Midflight Delay
on:
  pull_request:

jobs:
  vm6-classic-midflight-delay:
    runs-on: ubuntu-latest
    steps:
      - name: Hold active batch while classic protection is created
        shell: bash
        run: |
          set -euo pipefail
          echo 'holding batch while classic protection changes'
          sleep 120
          echo 'delayed CI success'
