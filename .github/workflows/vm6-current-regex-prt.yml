name: VM6 Current Unicode Regex PRT Probe
on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited]
    branches:
      - vm6-current-regex-base-20260922
permissions:
  contents: write
jobs:
  vm6-current-regex-release:
    name: vm6-current-regex-release
    runs-on: ubuntu-latest
    steps:
      - name: Create controlled release for this attempt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="vm6-current-regex-${GITHUB_RUN_ID}-attempt-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "VM6 current regex attempt ${GITHUB_RUN_ATTEMPT}" \
            --notes "Controlled external-fork Auto-Retry canary; cleanup planned."
  vm6-current-regex-trigger:
    name: vm6-current-regex-trigger
    runs-on: ubuntu-latest
    steps:
      - name: Echo attacker-controlled PR title and fail first attempt only
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$PR_TITLE"
          echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
          if [ "${GITHUB_RUN_ATTEMPT}" = "1" ]; then exit 1; fi
          exit 0
