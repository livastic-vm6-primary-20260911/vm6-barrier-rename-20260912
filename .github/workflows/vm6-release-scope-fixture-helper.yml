name: VM6 Release Scope Fixture Helper
on:
  push:
    branches:
      - vm6-release-scope-setup-20260919
permissions:
  contents: write
  pull-requests: write
jobs:
  merge-fixture-setup:
    runs-on: ubuntu-24.04
    steps:
      - name: Merge controlled setup PR
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          gh pr merge 240 --repo m6d911z2/vm6-barrier-rename-20260912 --merge --match-head-commit "$EXPECTED_HEAD"
