name: VM6 Direct Merge Guard
on:
  pull_request:
permissions:
  contents: read
jobs:
  vm6-direct-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail only on seed plus poisoned overlap
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f scope-a/seed.txt && -f scope-a/poisoned.txt ]]; then
            echo 'VM6_DIRECT_GUARD_FAIL: seed and poisoned overlap were combined'
            exit 42
          fi
          echo 'VM6_DIRECT_GUARD_PASS'
