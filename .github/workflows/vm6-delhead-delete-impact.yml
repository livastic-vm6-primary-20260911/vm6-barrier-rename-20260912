name: VM6 Protected Branch Delete Impact
on:
  delete:
permissions:
  contents: read
  issues: write
jobs:
  impact:
    if: github.event.ref_type == 'branch' && github.event.ref == 'vm6-delhead-impact-exempt'
    runs-on: ubuntu-latest
    steps:
      - name: Prove trusted delete-event credential execution
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DELETED_REF: ${{ github.event.ref }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/issues" \
            -f title='VM6_DELHEAD_PROTECTED_DELETE_TRUSTED_EXEC_20260913' \
            -f body="Mergify-triggered protected branch deletion reached trusted delete-event automation for ref $DELETED_REF at run $GITHUB_RUN_ID."
