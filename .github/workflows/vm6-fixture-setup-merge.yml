name: VM6 Fixture Setup Merge
on:
  push:
    branches:
      - vm6-customscope-victim-setup-20260919

permissions:
  contents: write
  pull-requests: write

jobs:
  merge-setup-pr:
    if: ${{ github.repository == 'm6d911z2/vm6-barrier-rename-20260912' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Merge controlled fixture setup PR
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          gh pr merge 235 \
            --repo m6d911z2/vm6-barrier-rename-20260912 \
            --merge \
            --match-head-commit "$EXPECTED_HEAD"
